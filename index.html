<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!--app-head-->
    <meta name="theme-color" content="#0b0f1a" />
    <!-- Google Search shows a favicon only when it is square and in a raster
         format, so these are PNG and ICO renders of the SVG symbol. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The fonts load without holding up the first paint: the text shows in
         the system's Chinese font first and switches when they arrive. -->
    <link
      id="fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@300..900&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@300..900&display=swap"
      />
    </noscript>
    <script>
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("motion");
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript>開啟 JavaScript 才看得到打字示範與動畫。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
