# Checks every push and pull request, deploys main to GitHub Pages, and tells
# Bing and the other IndexNow search engines that the pages changed.
# Based on https://vite.dev/guide/static-deploy#github-pages
name: Build and deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check, lint and format check
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Let a deployment in progress finish; a newer one waits in the queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # IndexNow lets a site tell Bing, Yandex, Naver and others that its pages
  # changed: https://www.indexnow.org/documentation. The key is public by
  # design; search engines check it against public/<key>.txt on the site.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    # A busy search engine should not mark a good deploy as failed.
    continue-on-error: true
    env:
      SITE: https://typomend.github.io
      INDEXNOW_KEY: 91a96eb96ac963b2cb0fa04af38f8c1c
    steps:
      - name: Submit the pages in the sitemap
        run: |
          urls=$(curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          jq -n --arg host "${SITE#https://}" --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}' \
            > body.json
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @body.json https://api.indexnow.org/indexnow)
          echo "IndexNow answered $status for $(jq '.urlList | length' body.json) pages"
          cat response.txt
          [ "$status" = 200 ] || [ "$status" = 202 ]
